server {
  listen 80;

  # The root directory for our static files
  root /usr/share/nginx/html;

  # This is needed for single-page applications (SPAs)
  # It ensures that any request that doesn't match a file
  # is redirected to index.html, allowing React Router to handle it.
  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests to the backend service
  # In Railway, you would replace 'http://backend:8080' with the
  # internal URL of your backend service (e.g., http://backend.railway.internal:8080)
  # or the public URL if it's exposed.
  location /search {
    proxy_pass http://backend:8080; # This will need to be updated in Railway
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
